<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RBX Toolkit – OBS widget</title>
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body {
    padding: 12px; color: #fff;
    font: 14px/1.3 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  }
  .card {
    width: 420px; padding: 16px 18px; border-radius: 18px;
    background: rgba(23, 21, 31, .92); border: 1px solid var(--accent, #ff2d55);
    box-shadow: 0 12px 30px rgba(0, 0, 0, .45);
  }
  .top { display: flex; align-items: center; gap: 12px; }
  .logo { width: 44px; height: 44px; flex: none; }
  .title { display: flex; flex-direction: column; }
  .label { color: #b9b3c9; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
  .count { font-size: 28px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .count span { color: #8d879e; font-weight: 700; font-size: 20px; }
  .bar { height: 10px; margin-top: 12px; border-radius: 5px; background: #2a2638; overflow: hidden; }
  #fill { height: 100%; width: 0; border-radius: 5px; background: var(--accent, #ff2d55); transition: width .8s cubic-bezier(.2, .8, .2, 1); }
  .alert {
    display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 10px 12px; border-radius: 14px;
    background: var(--accent-soft, rgba(255, 45, 85, .3));
    animation: in .55s cubic-bezier(.2, 1.4, .4, 1);
  }
  .alert img { width: 48px; height: 48px; border-radius: 50%; background: #2a2638; }
  .alert strong { display: block; font-size: 18px; }
  @keyframes in { from { transform: translateY(14px) scale(.92); opacity: 0; } }
  .status { margin-top: 8px; font-size: 11px; color: #8d879e; }
  body.compact .bar, body.compact .top { display: none; }
  body.compact .alert { margin-top: 0; }

  /* "Add me on Roblox" box */
  .addme { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .06); text-align: center; }
  .addme .label { display: block; }
  .addme strong { display: block; font-size: 20px; margin-top: 2px; }
  .addme small { display: block; color: #b9b3c9; font-size: 12px; margin-top: 4px; }

  /* Hint (e.g. "send me a request first") */
  .hint { margin-top: 10px; padding: 8px 12px; border-radius: 12px; background: rgba(255, 176, 32, .18); color: #ffd58a; font-weight: 600; font-size: 13px; animation: in .4s ease-out; }

  .hint.ok { background: rgba(47, 209, 135, .18); color: #8ff0c0; }

  /* Info (!roblox, !game) */
  .info { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: rgba(91, 140, 255, .2); border: 1px solid rgba(91, 140, 255, .45); animation: in .5s cubic-bezier(.2, 1.4, .4, 1); }
  .info strong { display: block; font-size: 20px; margin-top: 2px; }
  .info small { display: block; color: #c9d6ff; font-size: 12px; margin-top: 4px; }

  /* "Play with me" queue */
  .queue-line { margin-top: 10px; font-size: 13px; font-weight: 700; color: #b9b3c9; }
  .alert.turn { background: linear-gradient(135deg, rgba(47, 209, 135, .35), rgba(47, 209, 135, .12)); border: 1px solid rgba(47, 209, 135, .6); }
  .alert small { display: block; color: #b9b3c9; font-size: 12px; margin-top: 2px; }

  /* Vertical layout for TikTok */
  body.vertical .card { width: 300px; padding: 18px; text-align: center; }
  body.vertical .top { flex-direction: column; gap: 6px; }
  body.vertical .title { align-items: center; }
  body.vertical .logo { width: 52px; height: 52px; }
  body.vertical .count { font-size: 34px; }
  body.vertical .alert { flex-direction: column; text-align: center; gap: 8px; padding: 14px; }
  body.vertical .alert img { width: 72px; height: 72px; }
  body.vertical .alert strong { font-size: 22px; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="top">
      <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2d55"/><stop offset="1" stop-color="#ff6b3d"/></linearGradient>
          <mask id="gap"><rect width="100" height="100" fill="#fff"/><circle cx="71" cy="71" r="21.5" fill="#000"/></mask>
          <clipPath id="sh"><rect width="100" height="79"/></clipPath>
        </defs>
        <rect width="100" height="100" rx="23" fill="url(#g)"/>
        <g fill="#fff" mask="url(#gap)"><circle cx="40" cy="34" r="13.5"/><circle cx="40" cy="86" r="27" clip-path="url(#sh)"/></g>
        <circle cx="71" cy="71" r="17" fill="#16131f"/><rect x="63.5" y="67.8" width="15" height="6.4" rx="3.2" fill="#fff"/>
      </svg>
      <div class="title">
        <span class="label" id="label"></span>
        <span class="count"><b id="count">—</b> / <span id="goal">1000</span></span>
      </div>
    </div>
    <div class="bar"><div id="fill"></div></div>
    <div id="addme" class="addme" hidden>
      <span class="label" id="addmeLabel"></span>
      <strong id="addmeName"></strong>
      <small id="addmeHow"></small>
    </div>
    <div id="alert" class="alert" hidden>
      <img id="alertAvatar" alt="">
      <div>
        <span class="label" id="alertLabel"></span>
        <strong id="alertName"></strong>
        <small id="alertSub" hidden></small>
      </div>
    </div>
    <div id="info" class="info" hidden>
      <span class="label" id="infoTitle"></span>
      <strong id="infoText"></strong>
      <small id="infoSub"></small>
    </div>
    <div class="queue-line" id="queueLine" hidden></div>
    <div class="hint" id="hint" hidden></div>
    <div class="status" id="status" hidden></div>
  </div>

<script>
  // Parameters in the URL hash: #k=<code>&goal=1000&lang=en&v=1&compact=1&me=name&cmd=!add&color=ff2d55&sound=1&tpl=Text
  const params = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));

  const STRINGS = {

      "queued": "{name} is in the queue (#{pos})",
      "reconnecting": "Reconnecting…",
      "badLink": "Incomplete link: copy the link again from the RBX Toolkit dashboard.",
      "oldLink": "Outdated link: copy the new widget link from the RBX Toolkit dashboard."
    },
    "it": {

      "left": "Ancora in coda: {n}",

      "queueLine": "🎮 In coda per giocare: {n}",
      "queued": "{name} è in coda (#{pos})",

      "badLink": "Link incompleto: copia di nuovo il link dalla dashboard di RBX Toolkit.",
      "oldLink": "Link non aggiornato: copia il nuovo link del widget dalla dashboard di RBX Toolkit."
    },
    "es": {
      "friends": "Amigos de Roblox",
      "addMe": "Agrégame en Roblox",
      "howTo": "Envíame una solicitud y escribe {cmd} TuNombre en el chat",
      "newFriend": "¡Nuevo amigo!",
      "fromLive": "¡Bienvenido desde el directo!",
      "yourTurn": "¡Te toca! 🎮",
      "left": "Siguen en cola: {n}",
      "last": "Último de la cola",
      "queueLine": "🎮 En cola para jugar: {n}",
      "queued": "{name} está en la cola (#{pos})",
      "reconnecting": "Reconectando…",
      "badLink": "Enlace incompleto: vuelve a copiar el enlace desde el panel de RBX Toolkit.",
      "oldLink": "Enlace desactualizado: copia el nuevo enlace del widget desde el panel de RBX Toolkit."
    },
    "pt": {
      "friends": "Amigos do Roblox",
      "addMe": "Me adicione no Roblox",
      "howTo": "Me mande um pedido e digite {cmd} SeuNome no chat",
      "newFriend": "Novo amigo!",
      "fromLive": "Bem-vindo da live!",
      "yourTurn": "Sua vez! 🎮",
      "left": "Ainda na fila: {n}",
      "last": "Último da fila",
      "queueLine": "🎮 Na fila para jogar: {n}",
      "queued": "{name} está na fila (#{pos})",
      "reconnecting": "Reconectando…",
      "badLink": "Link incompleto: copie o link de novo no painel do RBX Toolkit.",
      "oldLink": "Link desatualizado: copie o novo link do widget no painel do RBX Toolkit."
    },
    "fr": {
      "friends": "Amis Roblox",
      "addMe": "Ajoute-moi sur Roblox",
      "howTo": "Envoie-moi une demande et écris {cmd} TonNom dans le chat",
      "newFriend": "Nouvel ami !",
      "fromLive": "Bienvenue depuis le live !",
      "yourTurn": "À toi ! 🎮",
      "left": "Encore dans la file : {n}",
      "last": "Dernier de la file",
      "queueLine": "🎮 Dans la file pour jouer : {n}",
      "queued": "{name} est dans la file (#{pos})",
      "reconnecting": "Reconnexion…",
      "badLink": "Lien incomplet : recopie le lien depuis le tableau de bord de RBX Toolkit.",
      "oldLink": "Lien obsolète : copiez le nouveau lien du widget depuis le tableau de bord RBX Toolkit."
    },
    "de": {
      "friends": "Roblox-Freunde",
      "addMe": "Füg mich auf Roblox hinzu",
      "howTo": "Schick mir eine Anfrage und schreib {cmd} DeinName in den Chat",
      "newFriend": "Neuer Freund!",
      "fromLive": "Willkommen aus dem Livestream!",
      "yourTurn": "Du bist dran! 🎮",
      "left": "Noch in der Warteschlange: {n}",
      "last": "Letzter in der Warteschlange",
      "queueLine": "🎮 Warteschlange zum Mitspielen: {n}",
      "queued": "{name} ist in der Warteschlange (#{pos})",
      "reconnecting": "Verbindung wird wiederhergestellt…",
      "badLink": "Unvollständiger Link: kopiere den Link erneut aus dem RBX-Toolkit-Dashboard.",
      "oldLink": "Veralteter Link: Kopiere den neuen Widget-Link aus dem RBX-Toolkit-Dashboard."
    },
    "pl": {
      "friends": "Znajomi w Roblox",
      "addMe": "Dodaj mnie w Roblox",
      "howTo": "Wyślij mi zaproszenie i napisz na czacie {cmd} TwojaNazwa",
      "newFriend": "Nowy znajomy!",
      "fromLive": "Witaj z live!",
      "yourTurn": "Twoja kolej! 🎮",
      "left": "Wciąż w kolejce: {n}",
      "last": "Ostatni w kolejce",
      "queueLine": "🎮 W kolejce do gry: {n}",
      "queued": "{name} jest w kolejce (#{pos})",
      "reconnecting": "Ponowne łączenie…",
      "badLink": "Niepełny link: skopiuj link ponownie z panelu RBX Toolkit.",
      "oldLink": "Nieaktualny link: skopiuj nowy link widżetu z panelu RBX Toolkit."
    },
    "tr": {
      "friends": "Roblox arkadaşları",
      "addMe": "Beni Roblox'ta ekle",
      "howTo": "Bana istek gönder ve sohbete {cmd} RobloxAdın yaz",
      "newFriend": "Yeni arkadaş!",
      "fromLive": "Yayından hoş geldin!",
      "yourTurn": "Sıra sende! 🎮",
      "left": "Hâlâ sırada: {n}",
      "last": "Sıranın sonuncusu",
      "queueLine": "🎮 Oynamak için sırada: {n}",
      "queued": "{name} sırada (#{pos})",
      "reconnecting": "Yeniden bağlanılıyor…",
      "badLink": "Eksik bağlantı: bağlantıyı RBX Toolkit panelinden tekrar kopyala.",
      "oldLink": "Eski bağlantı: yeni widget bağlantısını RBX Toolkit panelinden kopyala."
    },
    "ru": {
      "friends": "Друзья в Roblox",
      "addMe": "Добавь меня в Roblox",
      "howTo": "Отправь мне заявку и напиши в чат {cmd} ТвойНик",
      "newFriend": "Новый друг!",
      "fromLive": "Привет со стрима!",
      "yourTurn": "Твоя очередь! 🎮",
      "left": "Ещё в очереди: {n}",
      "last": "Последний в очереди",
      "queueLine": "🎮 В очереди на игру: {n}",
      "queued": "{name} в очереди (#{pos})",
      "reconnecting": "Переподключение…",
      "badLink": "Неполная ссылка: скопируй ссылку заново в панели RBX Toolkit.",
      "oldLink": "Устаревшая ссылка: скопируйте новую ссылку на виджет в панели RBX Toolkit."
    },
    "id": {
      "friends": "Teman Roblox",
      "addMe": "Tambahkan aku di Roblox",
      "howTo": "Kirim permintaan ke aku lalu ketik {cmd} NamaKamu di chat",
      "newFriend": "Teman baru!",
      "fromLive": "Selamat datang dari live!",
      "yourTurn": "Giliranmu! 🎮",
      "left": "Masih di antrean: {n}",
      "last": "Terakhir di antrean",
      "queueLine": "🎮 Antre untuk main: {n}",
      "queued": "{name} masuk antrean (#{pos})",
      "reconnecting": "Menyambung ulang…",
      "badLink": "Link tidak lengkap: salin lagi link-nya dari dasbor RBX Toolkit.",
      "oldLink": "Link usang: salin link widget yang baru dari dasbor RBX Toolkit."
    }
  };
  const LOCALES = { en: "en-US", it: "it-IT", es: "es-ES", pt: "pt-BR", fr: "fr-FR", de: "de-DE", pl: "pl-PL", tr: "tr-TR", ru: "ru-RU", id: "id-ID" };
  const lang = STRINGS[params.get("lang")] ? params.get("lang") : "en";
  document.documentElement.lang = lang;
  const tr = (key, vars = {}) => STRINGS[lang][key].replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
  const fmtNum = (n) => n.toLocaleString(LOCALES[lang]);
  document.getElementById("label").textContent = tr("friends");
  document.getElementById("addmeLabel").textContent = tr("addMe");
  document.getElementById("alertLabel").textContent = tr("newFriend");
  const key = params.get("k");
  const goal = Number(params.get("goal")) || 1000;
  if (params.get("compact") === "1") document.body.classList.add("compact");
  if (params.get("label")) document.getElementById("label").textContent = params.get("label");
  if (params.get("v") === "1") document.body.classList.add("vertical");
  if (params.get("me")) {
    document.getElementById("addme").hidden = false;
    document.getElementById("addmeName").textContent = "@" + params.get("me");
    if (params.get("cmd")) document.getElementById("addmeHow").textContent = tr("howTo", { cmd: params.get("cmd") });
  }
  const RELAY = "https://ntfy.sh";
  const $ = (id) => document.getElementById(id);

  // Customization (Pro): color, sound, alert text
  const color = /^[0-9a-f]{6}$/i.test(params.get("color") || "") ? "#" + params.get("color") : null;
  if (color) {
    document.documentElement.style.setProperty("--accent", color);
    document.documentElement.style.setProperty("--accent-soft", color + "55");
  }
  const sound = params.get("sound") === "1";
  const template = params.get("tpl") || "";

  let audioCtx;
  function chime(happy = true) {
    if (!sound) return;
    try {
      audioCtx = audioCtx || new AudioContext();
      const notes = happy ? [660, 880, 1320] : [520, 780];
      notes.forEach((f, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = "sine";
        o.frequency.value = f;
        const t = audioCtx.currentTime + i * 0.12;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        o.connect(g).connect(audioCtx.destination);
        o.start(t);
        o.stop(t + 0.4);
      });
    } catch (_) {}
  }

  let count = null;
  const queue = [];
  let showing = false;

  function draw() {
    $("count").textContent = count === null ? "—" : fmtNum(count);
    $("goal").textContent = fmtNum(goal);
    $("fill").style.width = count === null ? "0" : Math.min(100, (count / goal) * 100) + "%";
  }

  function status(text) {
    $("status").hidden = !text;
    $("status").textContent = text || "";
  }

  function showNext() {
    if (showing || !queue.length) return;
    showing = true;
    const f = queue.shift();
    const who = f.displayName || f.name || "";
    const isTurn = f.type === "turn";
    $("alertAvatar").hidden = !f.avatar;
    if (f.avatar) $("alertAvatar").src = f.avatar;
    // {name} (and {nome}, used by older versions) is replaced with the friend's name.
    $("alertName").textContent = isTurn ? who : template ? template.replace(/\{(name|nome)\}/gi, who) : who;
    $("alertLabel").textContent = isTurn ? tr("yourTurn") : f.source === "tiktok" ? tr("fromLive") : tr("newFriend");
    const sub = $("alertSub");
    sub.textContent = isTurn ? (f.left ? tr("left", { n: f.left }) : tr("last")) : "";
    sub.hidden = !sub.textContent;
    const box = $("alert");
    box.classList.toggle("turn", isTurn);
    chime(true);
    box.hidden = true;
    void box.offsetWidth;
    box.hidden = false;
    setTimeout(() => {
      box.hidden = true;
      showing = false;
      showNext();
    }, 6000);
  }

  let infoTimer;
  function showInfo(ev) {
    $("infoTitle").textContent = ev.title || "";
    $("infoText").textContent = ev.text || "";
    $("infoSub").textContent = ev.sub || "";
    $("infoSub").hidden = !ev.sub;
    const box = $("info");
    box.hidden = true;
    void box.offsetWidth;
    box.hidden = false;
    chime(false);
    clearTimeout(infoTimer);
    infoTimer = setTimeout(() => (box.hidden = true), 9000);
  }

  function drawQueue(n) {
    $("queueLine").hidden = !n;
    $("queueLine").textContent = tr("queueLine", { n });
  }

  let hintTimer;
  function showHint(text, kind = "") {
    const h = $("hint");
    h.className = "hint " + kind;
    h.textContent = text;
    h.hidden = true;
    void h.offsetWidth;
    h.hidden = false;
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => (h.hidden = true), 7000);
  }

  function handle(ev, live) {
    if (!ev || typeof ev !== "object") return;
    if (typeof ev.count === "number") count = ev.count;
    if ((ev.type === "friend" || ev.type === "turn") && live) queue.push(ev);
    if (ev.type === "hint" && live) showHint(ev.text);
    if (ev.type === "info" && live) showInfo(ev);
    if (typeof ev.queueCount === "number") drawQueue(ev.queueCount);
    if (ev.type === "queue" && ev.joined && live) showHint(tr("queued", { name: ev.joined, pos: ev.position }), "ok");
    draw();
    if (live) showNext();
  }

  // End-to-end encryption: events are AES-GCM encrypted by the extension. The key ("s") is only in
  // this page's URL hash, which browsers never send to servers, so the relay only sees ciphertext.
  const secret = params.get("s");
  let sticky = false;
  function stickyStatus(text) {
    sticky = true;
    status(text);
  }
  const fromB64url = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
  let cryptoKey = null;
  async function getCryptoKey() {
    if (!cryptoKey) cryptoKey = await crypto.subtle.importKey("raw", fromB64url(secret), "AES-GCM", false, ["decrypt"]);
    return cryptoKey;
  }

  // Extracts the text of an ntfy message (or null for keepalive/open events).
  function messageText(msg) {
    try {
      const outer = typeof msg === "string" ? JSON.parse(msg) : msg;
      if (outer.event && outer.event !== "message") return null;
      return outer.message;
    } catch (_) {
      return null;
    }
  }

  async function decode(text) {
    let obj;
    try {
      obj = JSON.parse(text);
    } catch (_) {
      return null;
    }
    if (obj && obj.v === 1 && obj.iv && obj.d) {
      if (!secret) {
        stickyStatus(tr("oldLink"));
        return null;
      }
      try {
        const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64url(obj.iv) }, await getCryptoKey(), fromB64url(obj.d));
        return JSON.parse(new TextDecoder().decode(plain));
      } catch (_) {
        return null; // wrong key or tampered message
      }
    }
    // Unencrypted events are accepted only by old links without a key.
    return secret ? null : obj;
  }

  async function receive(msg, live) {
    const text = messageText(msg);
    if (text == null) return;
    handle(await decode(text), live);
  }

  async function loadLast() {
    // Gets the latest count sent (ntfy keeps messages for a few hours).
    try {
      const res = await fetch(`${RELAY}/${key}/json?poll=1&since=12h`);
      const lines = (await res.text()).trim().split("\n").filter(Boolean);
      for (const line of lines) await receive(line, false);
    } catch (_) {}
  }

  function connect() {
    const es = new EventSource(`${RELAY}/${key}/sse`);
    es.onopen = () => sticky || status("");
    es.onmessage = (e) => receive(e.data, true);
    es.onerror = () => sticky || status(tr("reconnecting"));
  }

  draw();
  if (!key) {
    status(tr("badLink"));
  } else {
    loadLast().then(connect);
  }
</script>
</body>
</html>
